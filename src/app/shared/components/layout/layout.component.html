<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
               [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
               [mode]="(isHandset$ | async) ? 'over' : 'side'"
               [opened]="(isHandset$ | async) === false">
    <mat-toolbar>DigitalFix</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" *ngIf="sessionService.hasAnyRole(['SUPERVISOR', 'ADMIN'])">Dashboard</a>
      <a mat-list-item routerLink="/workorders" *ngIf="sessionService.hasAnyRole(['TECNICO', 'SUPERVISOR', 'ADMIN'])">Órdenes de Trabajo</a>
      <a mat-list-item routerLink="/catalog" *ngIf="sessionService.hasAnyRole(['TECNICO', 'SUPERVISOR', 'ADMIN'])">Catálogo</a>
      <a mat-list-item routerLink="/audit" *ngIf="sessionService.hasRole('ADMIN')">Auditoría</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar class="top-toolbar">
      <button
        type="button"
        aria-label="Toggle sidenav"
        mat-icon-button
        (click)="drawer.toggle()"
        *ngIf="isHandset$ | async">
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      <span>Gestión de Operaciones</span>

      <span class="spacer" style="flex: 1 1 auto;"></span>

      <!-- Bloque del Perfil del Usuario -->
      <div style="display: flex; align-items: center; gap: 16px;" *ngIf="authContext.profile$ | async as profile">
        <div style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2;">
          <span style="font-weight: 500; font-size: 14px;">{{ profile.name }}</span>
          <span style="font-size: 12px; color: rgba(0,0,0,0.6);">{{ profile.companyName }}</span>
        </div>

        <button mat-icon-button aria-label="Cerrar sesión" (click)="cerrarSesion()" color="warn">
          <mat-icon>logout</mat-icon>
        </button>
      </div>

    </mat-toolbar>
    <main class="content-padding">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
